# Overrides para desenvolvimento local. Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Não usar quando ENABLE_MCP_SERVER=true: --reload mata conexões MCP durante o ciclo de vida.
services:
  api:
    restart: "no"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
    volumes:
      - ./api:/app
      - /app/.venv
    ports:
      - "8000:8000"

  # Painel em container só com --profile docker-web; o normal é `pnpm --filter web dev` no host.
  web:
    profiles: [docker-web]
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
    restart: "no"
    working_dir: /app/web
    command: pnpm dev --hostname 0.0.0.0
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
