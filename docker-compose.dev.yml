# Overrides para desenvolvimento local. Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Não usar quando ENABLE_MCP_SERVER=true: --reload mata conexões MCP durante o ciclo de vida.
services:
  api:
    # imagem local: sem isso o compose puxaria a publicada no GHCR
    image: automata-api:dev
    restart: "no"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      DEMO_REPLAY: ${DEMO_REPLAY:-false}
      # com a 8000 publicada, a rede privada não é só do compose: X-Forwarded-For não vale
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./api:/app
      - /app/.venv
    ports:
      - "127.0.0.1:8000:8000"

  # Painel em container só com --profile docker-web; o normal é `pnpm --filter web dev` no host.
  web:
    image: automata-web:dev
    profiles: [docker-web]
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
    restart: "no"
    working_dir: /app/web
    command: pnpm dev --hostname 0.0.0.0
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
