# Overrides para desenvolvimento local. Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Não usar quando ENABLE_MCP_SERVER=true: --reload mata conexões MCP durante o ciclo de vida.
services:
  api:
    restart: "no"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    profiles: [docker-web]
