[project]
name = "automata-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno[os,mcp]==3.1.8",
    "anthropic>=0.40",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "cryptography>=43.0",
    "fastmcp>=4.0.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "redis>=8.1.0",
    "pgvector>=0.5.1",
    "voyageai>=0.5.0",
    "pypdf>=6.21.0",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "aiofiles>=25.1.0",
    "boto3>=1.40",
    # já vinha pelo agno; declarado porque a saída estruturada valida schema e resposta
    "jsonschema>=4.26",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.1",
    "testcontainers[postgres]>=4.9",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# boto3 não traz tipos; o conector de S3 só usa list_objects_v2 e get_object
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# jsonschema não traz tipos; só Draft202012Validator e SchemaError são usados
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"
markers = [
    "nightly: testes que chamam LLM real — só rodam na suite noturna",
]
