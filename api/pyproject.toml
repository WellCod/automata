[project]
name = "automata-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno[os]==2.8.7",
    "anthropic>=0.40",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "cryptography>=43.0",
    "fastmcp>=3.4.6",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.1",
    "testcontainers[postgres]>=4.9",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "nightly: testes que chamam LLM real — só rodam na suite noturna",
]
