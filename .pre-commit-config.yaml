repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^api/
      - id: ruff-format
        files: ^api/

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.8.0
    hooks:
      - id: eslint
        files: ^web/
        types_or: [javascript, jsx, ts, tsx]
        additional_dependencies:
          - eslint@10.8.0
