# Atualizações semanais com aviso de segurança (Fase 51, SEC-02). O CI barra dependência
# de produção com aviso alto (pnpm audit) ou conhecido (pip-audit).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      painel:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # os plugins do eslint-config-next ainda pedem o eslint 9
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # versão maior dos SDKs dos provedores só junto com o Agno, que é quem os usa
      - dependency-name: anthropic
        update-types: [version-update:semver-major]
      - dependency-name: openai
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: monthly
    ignore:
      # python 3.12 e node 22 (LTS) são a base da stack; troca de versão é decisão, não rotina
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
