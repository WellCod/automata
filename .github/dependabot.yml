# Atualizações semanais com aviso de segurança (Fase 51, SEC-02). O CI barra dependência
# de produção com aviso alto (pnpm audit) ou conhecido (pip-audit).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      painel:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # o openapi-typescript, que gera os tipos do client, pede o typescript 5
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # os plugins do eslint-config-next ainda pedem o eslint 9
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: monthly
    ignore:
      # 3.15 sem wheel do zstandard e do pyyaml (2026-11): a imagem slim não tem compilador
      - dependency-name: python
        versions: ["3.15.x"]
      # node só nas versões LTS (pares): a ímpar dura seis meses
      - dependency-name: node
        versions: ["27.x", "29.x", "31.x"]
