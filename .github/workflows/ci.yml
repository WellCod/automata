name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: api
          enable-cache: true
      - run: uv sync --frozen
        working-directory: api
      - run: uv run ruff check .
        working-directory: api
      - run: uv run ruff format --check .
        working-directory: api
      - run: uv run mypy app
        working-directory: api
      - name: cache imagem postgres (pgvector) para testcontainers
        run: docker pull pgvector/pgvector:pg17
      - run: uv run pytest -m "not nightly" --cov=app --cov-report=xml
        working-directory: api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: api/coverage.xml

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: api
      - run: uv sync --frozen
        working-directory: api
      - run: pnpm install --frozen-lockfile
      - run: node web/scripts/gen-api.mjs
      - run: pnpm --filter web exec prettier --write src/lib/api/schema.d.ts
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web lint
      - run: pnpm --filter web format:check
      - run: pnpm --filter web test

  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  # Imagens de produção: o dev usa o override com código montado e não as exercita.
  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          load: true
          tags: automata-api:ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image
      - name: fixtures do replay estão na imagem
        run: docker run --rm --entrypoint test automata-api:ci -f fixtures/default.json

  web-image:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: automata-web:ci
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image
      - name: sobe a imagem e checa /login e o css
        run: |
          docker run -d --name web -p 3000:3000 -e AUTOMATA_API_URL=http://localhost:8000 automata-web:ci
          for _ in $(seq 1 30); do
            curl -fsS -o /tmp/login.html http://localhost:3000/login && break
            sleep 1
          done
          css=$(grep -o '/_next/static/[^"]*\.css' /tmp/login.html | head -1)
          if [[ -z "$css" ]] || ! curl -fsS -o /dev/null "http://localhost:3000$css"; then
            docker logs web
            exit 1
          fi

  gate:
    needs: [api, web, e2e, api-image, web-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: falha se algum job falhou ou foi cancelado
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
