name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# só leitura do repositório; quem precisa de mais pede no próprio job
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          working-directory: api
          enable-cache: true
      - run: uv sync --frozen
        working-directory: api
      - name: dependências com aviso de segurança conhecido
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements.txt --no-deps --disable-pip
        working-directory: api
      - run: uv run ruff check .
        working-directory: api
      - run: uv run ruff format --check .
        working-directory: api
      - run: uv run mypy app
        working-directory: api
      - name: cache imagem postgres (pgvector) para testcontainers
        run: docker pull pgvector/pgvector:pg17
      - run: uv run pytest -m "not nightly" --cov=app --cov-report=xml
        working-directory: api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: api/coverage.xml

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          working-directory: api
      - run: uv sync --frozen
        working-directory: api
      - run: pnpm install --frozen-lockfile
      - name: dependências de produção com aviso alto ou crítico
        run: pnpm audit --prod --audit-level high
      - run: node web/scripts/gen-api.mjs
      - run: pnpm --filter web exec prettier --write src/lib/api/schema.d.ts
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web lint
      - run: pnpm --filter web format:check
      - run: pnpm --filter web test

  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  # Imagens de produção: o dev usa o override com código montado e não as exercita.
  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api
          load: true
          tags: automata-api:ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image
      - name: fixtures do replay estão na imagem
        run: docker run --rm --entrypoint test automata-api:ci -f fixtures/default.json

  web-image:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: automata-web:ci
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image
      - name: sobe a imagem e checa /login e o css
        run: |
          docker run -d --name web -p 3000:3000 -e AUTOMATA_API_URL=http://localhost:8000 automata-web:ci
          for _ in $(seq 1 30); do
            curl -fsS -o /tmp/login.html http://localhost:3000/login && break
            sleep 1
          done
          css=$(grep -o '/_next/static/[^"]*\.css' /tmp/login.html | head -1)
          if [[ -z "$css" ]] || ! curl -fsS -o /dev/null "http://localhost:3000$css"; then
            docker logs web
            exit 1
          fi

  gate:
    needs: [api, web, e2e, api-image, web-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: falha se algum job falhou ou foi cancelado
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
