name: Evals Noturnas

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC
  workflow_dispatch:

# só leitura do repositório; quem precisa de mais pede no próprio job
permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
      - run: uv sync --frozen
        working-directory: api
      # suíte parcial: o gate de cobertura do pyproject só faz sentido na suíte completa
      # -rA: mostra a saída dos que passaram (o recall de cada estratégia de busca)
      - run: uv run pytest -m nightly -v -rA --no-cov
        working-directory: api
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      # sem isso a falha da noturna só aparecia para quem abrisse a aba Actions (ARQ-04)
      - name: abre issue quando as evals noturnas falham
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Evals noturnas falharam em $(date -u +%Y-%m-%d)" \
            --body "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
