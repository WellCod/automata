name: Evals Noturnas

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC
  workflow_dispatch:

# só leitura do repositório; quem precisa de mais pede no próprio job
permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          working-directory: api
      - run: uv sync --frozen
        working-directory: api
      # suíte parcial: o gate de cobertura do pyproject só faz sentido na suíte completa
      # -rA: mostra a saída dos que passaram (o recall de cada estratégia de busca)
      - run: uv run pytest -m nightly -v -rA --no-cov
        working-directory: api
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
