name: Evals Noturnas

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: api
      - run: uv sync --frozen
        working-directory: api
      # suíte parcial: o gate de cobertura do pyproject só faz sentido na suíte completa
      - run: uv run pytest -m nightly -v --no-cov
        working-directory: api
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
