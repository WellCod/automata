# Implantação da demo. Use diretamente (não é override):
#   docker compose -f docker-compose.demo.yml up -d
#
# Variáveis obrigatórias (.env ou ambiente):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   DATABASE_URL, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY
#   AUTOMATA_API_URL=http://api:8000  (interno ao compose)
#
# JWT_PRIVATE_KEY e JWT_PUBLIC_KEY são passadas SOMENTE para a API.
# O container web não recebe a chave privada — o BFF Next.js a lê
# via variável de ambiente do processo Node (não do Docker environment).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - demo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  api:
    image: ghcr.io/wellcod/automata-api:latest
    container_name: automata-demo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      DEMO_REPLAY: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  web:
    image: ghcr.io/wellcod/automata-web:latest
    container_name: automata-demo-web
    restart: unless-stopped
    environment:
      AUTOMATA_API_URL: ${AUTOMATA_API_URL:-http://api:8000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

volumes:
  demo_pg_data:
