# Implantação da demo. Use diretamente (não é override):
#   docker compose -f docker-compose.demo.yml up -d
#
# Variáveis obrigatórias (.env ou ambiente):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   DATABASE_URL, JWT_PRIVATE_KEY, JWT_PUBLIC_KEY
#   AUTOMATA_API_URL=http://api:8000  (interno ao compose; a porta 8000 não é publicada)
#
# JWT_PRIVATE_KEY vai SOMENTE para a API, que emite os tokens.
# O container web recebe só JWT_PUBLIC_KEY, usada pelo proxy para verificá-los.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - demo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  api:
    image: ghcr.io/wellcod/automata-api:latest
    container_name: automata-demo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MCP_SECRETS_KEY: ${MCP_SECRETS_KEY:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      KNOWLEDGE_DEFAULT_EMBEDDER: ${KNOWLEDGE_DEFAULT_EMBEDDER:-voyage}
      KNOWLEDGE_MAX_UPLOAD_MB: ${KNOWLEDGE_MAX_UPLOAD_MB:-20}
      DEMO_REPLAY: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M  # embedder e leitores de documento do RAG (ADR-0012)

  web:
    image: ghcr.io/wellcod/automata-web:latest
    container_name: automata-demo-web
    restart: unless-stopped
    environment:
      AUTOMATA_API_URL: ${AUTOMATA_API_URL:-http://api:8000}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports:
      - "3000:3000"
    healthcheck:
      # 127.0.0.1: no Alpine, localhost resolve para ::1 e o Next standalone só escuta em IPv4
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

volumes:
  demo_pg_data:
